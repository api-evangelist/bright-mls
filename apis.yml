image: https://images.ctfassets.net/1g8q1frp41ix/19Q1y6e6KSRESmQY8117MC/28b12fb1278bf35568ad05efd3c7b577/social-share-default-image.jpg

description: Bright MLS is one of the largest multiple listing services in the United States, serving real estate professionals across the Mid-Atlantic.
  Its developer portal (developer.brightmls.com, a SwaggerHub Portal) documents the RESO Web API (OData, RESO Data Dictionary 1.6 Platinum certified)
  for licensed listing data and the ShowingHub showing-scheduling interoperability API, and its public SwaggerHub registry publishes OpenAPI contracts
  for the Data Hub ingestion and DataLake distribution services and the Manifest Services API for media vendors.

