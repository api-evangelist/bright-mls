- aid: bright-mls:bright-mls-showinghub-api
  name: Bright MLS ShowingHub API
  description: >-
    ShowingHub is an MLS-provided service for interoperability between showing-scheduling systems, covering
    registrations and transfers, appointments and event notifications through subscriptions; per-environment
    Swagger UI is served at the API host after login. No public contract is published.
  humanURL: https://developer.brightmls.com/showinghub/default/introduction
