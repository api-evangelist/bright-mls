apis:
- aid: bright-mls:bright-mls-reso-web-api
  name: Bright MLS RESO Web API
  description: OData-based RESO Web API giving licensed vendors access to Bright MLS listing data described by the RESO Data Dictionary; the $metadata
    document and the service root require a bearer token (anonymous requests return 401). No public OpenAPI is published for it.
  humanURL: https://developer.brightmls.com/brightreso/default/overview
  baseURL: https://bright-reso.brightmls.com/RESO/OData/bright
  tags:
  - RESO
  - OData
  - Listings
  properties:
  - type: Documentation
    url: https://developer.brightmls.com/brightreso/default/overview
  - type: Authentication
    url: https://developer.brightmls.com/brightreso/default/authentication
  - type: ErrorHandling
    url: https://developer.brightmls.com/brightreso/default/error-handling
  - type: FAQ
    url: https://developer.brightmls.com/brightreso/default/faq
- aid: bright-mls:bright-mls-showinghub-api
  name: Bright MLS ShowingHub API
  description: ShowingHub is an MLS-provided service for interoperability between showing-scheduling systems, covering registrations and transfers,
    appointments and event notifications through subscriptions; per-environment Swagger UI is served at the API host after login. No public contract
    is published.
  humanURL: https://developer.brightmls.com/showinghub/default/introduction
  tags:
  - Showings
  - Scheduling
  properties:
  - type: Documentation
    url: https://developer.brightmls.com/showinghub/default/introduction
  - type: Authentication
    url: https://developer.brightmls.com/showinghub/default/authorization
- aid: bright-mls:bright-mls-manifest-services
  name: Bright MLS Manifest Services
  description: API for media vendors that securely stores a JSON manifest for later retrieval by Bright MLS (create a manifest and fetch it by
    UUID), authenticated with an API key.
  humanURL: https://api.swaggerhub.com/apis/BrightMLS/Manifest.Services/1.0.0
  baseURL: https://bright-manifestservices.prd.brightmls.com
  tags:
  - Media
  - Manifests
