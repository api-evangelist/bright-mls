- aid: bright-mls:bright-mls-reso-web-api
  name: Bright MLS RESO Web API
  description: >-
    OData-based RESO Web API giving licensed vendors access to Bright MLS listing data described by the
    RESO Data Dictionary; the $metadata document and the service root require a bearer token (anonymous
    requests return 401). No public OpenAPI is published for it.
  humanURL: https://developer.brightmls.com/brightreso/default/overview
  baseURL: https://bright-reso.brightmls.com/RESO/OData/bright
