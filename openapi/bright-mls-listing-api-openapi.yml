openapi: 3.2.0
info:
  version: '1.0'
  title: DataLake Distribution Service Listing API
  description: DataLake Distribution Service API
servers:
- description: SwaggerHub API
  url: https://4qpk2x8mkb.execute-api.us-east-1.amazonaws.com/t1
tags:
- name: Listing
paths:
  /datahub/listing/delta/{date}:
    get:
      summary: Distribution Service GET API to fetch presigned url for delta package
      description: 'By using this GET API endpoint an authorized consumer can request to recieve the delta package for a specific date.

        The package may include all newly received listing type data that were received on the same date [as provided in place of date parameter] after 4 AM GMT / UTC.

        As the package is quite large in size therefor we provide a presigned URL starting with https://aue1t1z1s3bdatahubdistributionservices-distribution.s3.amazonaws.com and the presigned url would expire in next 10 minutes'
      tags:
      - Listing
      parameters:
      - name: date
        in: path
        description: The date of delta package generation
        required: true
        example: yyyymmdd
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPackageResponse'
        '400':
          description: 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 403 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: 404 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDatahubListingDeltaByDate
      x-operation-id-source: derived
  /datahub/listing/historical/{date}:
    get:
      summary: Distribution Service GET API to fetch presigned url for historical package
      description: 'By using this GET API endpoint an authorized consumer can request to recieve all available listing data from the original date the data is ingested to the date the consumer is onboarded package for a specific date.

        As the package is quite large in size therefor we provide a presigned URL starting with https://aue1t1z1s3bdatahubdistributionservices-distribution.s3.amazonaws.com and the presigned url would expire in next 10 minutes'
      tags:
      - Listing
      parameters:
      - name: date
        in: path
        description: The date of delta package generation
        required: true
        example: yyyymmdd
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPackageResponse'
        '400':
          description: 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 403 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: 404 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDatahubListingHistoricalByDate
      x-operation-id-source: derived
components:
  schemas:
    ApiInfo:
      type: object
      properties:
        version:
          type: string
          example: '1.0'
        timestamp:
          type: number
          description: 'UTC timestamp in miliseconds when the response was generated from the server

            '
          example: 1659599754000
        provider:
          type: string
          example: BrightMLS
    Error:
      type: object
      properties:
        apiInfo:
          $ref: '#/components/schemas/ApiInfo'
        message:
          type: string
          example: Error message
      title: Error Response
    GetPackageResponse:
      type: object
      required:
      - apiInfo
      - description
      - message
      - url
      properties:
        apiInfo:
          $ref: '#/components/schemas/ApiInfo'
        description:
          type: string
        message:
          type: string
        url:
          type: string
          description: 'Presigned url of the data package

            '
    Forbidden:
      type: object
      properties:
        message:
          type: string
          default: Forbidden
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
